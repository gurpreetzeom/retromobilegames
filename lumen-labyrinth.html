<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumen Labyrinth | COSTIN Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#10142c;color:#f4f6ff;font:16px system-ui;text-align:center}main{max-width:650px;margin:auto;padding:18px}a{color:#9ee}canvas{display:block;width:min(100%,520px);height:auto;aspect-ratio:1;background:#151d37;border:3px solid #7ce0bd;border-radius:12px;margin:16px auto;touch-action:none}button{background:#283b66;color:white;border:1px solid #8bc6d6;border-radius:10px;padding:14px 18px;font:inherit;touch-action:none;user-select:none}.pad{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:5px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:2}.pad button:nth-child(4){grid-column:3}#status{min-height:2em}button:focus-visible{outline:3px solid #ffdc7a}</style><main><a href="./arcade.html">← COSTIN Arcade</a><h1>Lumen Labyrinth</h1><p>Original maze adventure: guide a tiny lantern creature, gather every spark, then reach the glowing gate. Avoid roaming shadows.</p><div id="status" role="status" aria-live="polite"></div><canvas id="board" width="480" height="480" aria-label="Maze game board"></canvas><div class="pad"><button data-dir="up" aria-label="Up">▲</button><button data-dir="left" aria-label="Left">◀</button><button data-dir="down" aria-label="Down">▼</button><button data-dir="right" aria-label="Right">▶</button></div><p><button id="restart">Restart level</button> <button id="new">Start over</button></p><p>Arrow keys / WASD or touch buttons. Three levels. Three hearts.</p></main><script>
'use strict';
const maps=[
["############","#P..#...S..#","#.#.#.###..#","#.#...#....#","#.###.#.##.#","#...#.#....#","###.#.####.#","#...#....#.#","#.#####..#.#","#....S.....#","#...#.....G#","############"],
["############","#P...#..S..#","###..#.#.#.#","#....#.#...#","#.####.###.#","#...S......#","#.#.######.#","#.#........#","#.#####.##.#","#.....#....#","#...#.....G#","############"],
["############","#P..#......#","#.#.#.####.#","#.#...#..S.#","#.###.#.##.#","#.....#....#","#####.#.##.#","#.....#....#","#.###.####.#","#..S.......#","#...#.....G#","############"]];
const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');const N=12,T=40;
let level=0,hearts=3,grid=[],player={x:1,y:1},sparks=new Set(),shadows=[],gate={x:10,y:10},phase='ready',ticks=0;
const key=(x,y)=>x+','+y;const wall=(x,y)=>!grid[y]||grid[y][x]==='#';
function setup(resetHearts=false){if(resetHearts)hearts=3;grid=maps[level].map(r=>r.split(''));sparks.clear();shadows=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=grid[y][x];if(c==='P')player={x,y};if(c==='S')sparks.add(key(x,y));if(c==='G')gate={x,y};}shadows=[{x:9,y:3,dir:1},{x:3,y:9,dir:-1}].filter(s=>!wall(s.x,s.y));phase='playing';ticks=0;render();}
function render(){ctx.fillStyle='#141a35';ctx.fillRect(0,0,480,480);for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=wall(x,y)?'#3b5271':'#1b2944';ctx.fillRect(x*T+1,y*T+1,T-2,T-2);if(sparks.has(key(x,y))){ctx.fillStyle='#ffdc71';ctx.beginPath();ctx.arc(x*T+20,y*T+20,8,0,7);ctx.fill()}}ctx.fillStyle=sparks.size?'#62617d':'#55e6a3';ctx.fillRect(gate.x*T+10,gate.y*T+6,20,28);for(const s of shadows){ctx.fillStyle='#e477bb';ctx.beginPath();ctx.arc(s.x*T+20,s.y*T+20,13,0,7);ctx.fill()}ctx.fillStyle='#8ef3cf';ctx.beginPath();ctx.arc(player.x*T+20,player.y*T+20,13,0,7);ctx.fill();ctx.fillStyle='#142b3b';ctx.fillRect(player.x*T+16,player.y*T+15,3,4);ctx.fillRect(player.x*T+23,player.y*T+15,3,4);status.textContent='Level '+(level+1)+'/3 · Hearts '+hearts+' · Sparks remaining '+sparks.size+(phase==='won'?' · YOU WIN!':phase==='lost'?' · GAME OVER':phase==='level'?' · Level cleared!':'');}
function move(dx,dy){if(phase!=='playing')return;const x=player.x+dx,y=player.y+dy;if(wall(x,y))return;player={x,y};sparks.delete(key(x,y));ticks++;if(ticks%2===0)for(const s of shadows){const nx=s.x+s.dir;if(wall(nx,s.y)){s.dir*=-1}else s.x=nx}if(shadows.some(s=>s.x===x&&s.y===y)){hearts--;if(!hearts){phase='lost';render();return}player={x:1,y:1};const start=grid.flatMap((r,yy)=>r.map((c,xx)=>c==='P'?{x:xx,y:yy}:null)).find(Boolean);player=start;}if(player.x===gate.x&&player.y===gate.y&&!sparks.size){if(level===maps.length-1)phase='won';else{level++;setup();return}}render();}
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};function act(d){if(dirs[d])move(...dirs[d])}
document.addEventListener('keydown',e=>{const d={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'}[e.code];if(d){e.preventDefault();act(d)}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();act(b.dataset.dir)}));document.querySelector('#restart').onclick=()=>setup();document.querySelector('#new').onclick=()=>{level=0;setup(true)};setup(true);
</script></html>
