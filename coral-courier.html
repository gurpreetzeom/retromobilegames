<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Play Coral Courier, an original free underwater arcade game with keyboard and touchscreen controls."><title>Coral Courier | COSTIN Retro Arcade</title><style>*{box-sizing:border-box}body{background:#08182b;color:#f5fbff;font:16px system-ui;margin:0;padding:20px;text-align:center}main{max-width:850px;margin:auto}h1{margin:10px 0;color:#8bf7e7}p{color:#b9d3e2}canvas{width:100%;max-width:800px;aspect-ratio:2/1;border:3px solid #65dccc;border-radius:12px;background:#072f4e;display:block;margin:12px auto;touch-action:none}.controls{display:flex;justify-content:center;gap:15px;align-items:center;margin:15px auto;flex-wrap:wrap}.pad{display:grid;grid-template-columns:repeat(3,56px);gap:5px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:2}.pad button:nth-child(4){grid-column:3}button{background:#244c69;color:white;border:1px solid #75e5dc;border-radius:12px;padding:13px;min-height:50px;touch-action:none;font-size:20px;cursor:pointer}#restart{background:#7763d2}#status{font-weight:700;color:#d7ffea}a{color:#93f2f2}</style></head><body><main><p><a href="arcade.html">← All arcade games</a></p><h1>🐚 Coral Courier</h1><p>Collect 12 glowing pearls. Avoid the reef guardians. Arrows or WASD to swim; on mobile use the directional pad.</p><div id="status" aria-live="polite">Pearls 0/12 · Hearts 3</div><canvas id="game" width="800" height="400" aria-label="Coral Courier playable game"></canvas><div class="controls"><div class="pad"><button data-key="ArrowUp" aria-label="Up">▲</button><button data-key="ArrowLeft" aria-label="Left">◀</button><button data-key="ArrowDown" aria-label="Down">▼</button><button data-key="ArrowRight" aria-label="Right">▶</button></div><button id="restart">↻ Restart</button></div><p>Original COSTIN game · No downloads or ROMs</p></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),c=canvas.getContext('2d'),status=document.getElementById('status'),held=new Set();let player,pearls,enemies,collected,hearts,invul,state,tick;const rnd=(min,max)=>min+Math.random()*(max-min);function reset(){player={x:90,y:200};pearls=[];enemies=[];collected=0;hearts=3;invul=0;state='play';tick=0;held.clear();for(let i=0;i<6;i++)spawnPearl();for(let i=0;i<4;i++)enemies.push({x:rnd(230,760),y:rnd(35,365),vx:rnd(1,2.4)*(i%2?-1:1),vy:rnd(-1.3,1.3)});refresh()}function spawnPearl(){pearls.push({x:rnd(50,750),y:rnd(35,365)})}function refresh(){status.textContent=state==='play'?'Pearls '+collected+'/12 · Hearts '+hearts:state==='win'?'You win! All 12 pearls collected.':'Game over · '+collected+' pearls collected.'}function circle(x,y,r,color){c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}function update(){if(state!=='play')return;tick++;let dx=(held.has('ArrowRight')||held.has('KeyD')?1:0)-(held.has('ArrowLeft')||held.has('KeyA')?1:0),dy=(held.has('ArrowDown')||held.has('KeyS')?1:0)-(held.has('ArrowUp')||held.has('KeyW')?1:0),len=Math.hypot(dx,dy)||1;player.x=Math.max(18,Math.min(782,player.x+dx/len*4));player.y=Math.max(18,Math.min(382,player.y+dy/len*4));if(invul>0)invul--;for(let i=pearls.length-1;i>=0;i--){if(Math.hypot(player.x-pearls[i].x,player.y-pearls[i].y)<23){pearls.splice(i,1);collected++;if(collected>=12){state='win';refresh();return}spawnPearl();refresh()}}for(const e of enemies){e.x+=e.vx;e.y+=e.vy;if(e.x<25||e.x>775)e.vx*=-1;if(e.y<25||e.y>375)e.vy*=-1;if(invul===0&&Math.hypot(player.x-e.x,player.y-e.y)<30){hearts--;invul=75;if(hearts<=0)state='lose';refresh()}}}function draw(){c.fillStyle='#09304e';c.fillRect(0,0,800,400);for(let i=0;i<25;i++){circle((i*137+tick*.25)%800,(i*73)%400,2,'#2e6a88')}c.fillStyle='#186c69';for(let i=0;i<16;i++)c.fillRect(i*53,365-(i%4)*16,8,35+(i%4)*16);for(const p of pearls){circle(p.x,p.y,11,'#f9e6a4');circle(p.x-3,p.y-3,4,'#fffbe3')}for(const e of enemies){circle(e.x,e.y,20,'#e9779b');circle(e.x-6,e.y-5,4,'#fff');circle(e.x-6,e.y-5,2,'#14253b');c.fillStyle='#efb2c7';c.beginPath();c.moveTo(e.x+12,e.y);c.lineTo(e.x+30,e.y-13);c.lineTo(e.x+30,e.y+13);c.fill()}if(invul%10<5){circle(player.x,player.y,18,'#6ce4c8');circle(player.x+6,player.y-5,4,'#123c54');c.fillStyle='#49b1a5';c.beginPath();c.moveTo(player.x-12,player.y);c.lineTo(player.x-28,player.y-13);c.lineTo(player.x-28,player.y+13);c.fill()}if(state!=='play'){c.fillStyle='#061525dd';c.fillRect(0,0,800,400);c.fillStyle='#fff';c.font='bold 44px system-ui';c.textAlign='center';c.fillText(state==='win'?'REEF RESCUED!':'GAME OVER',400,190);c.font='22px system-ui';c.fillText('Press Restart to play again',400,232);c.textAlign='left'}}function loop(){update();draw();requestAnimationFrame(loop)}window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)){e.preventDefault();held.add(e.code)}});window.addEventListener('keyup',e=>held.delete(e.code));window.addEventListener('blur',()=>held.clear());document.querySelectorAll('[data-key]').forEach(b=>{const key=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.add(key)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>held.delete(key))});document.getElementById('restart').addEventListener('click',reset);reset();requestAnimationFrame(loop)})();
</script></body></html>
