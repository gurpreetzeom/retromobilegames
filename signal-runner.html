<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Runner | COSTIN Retro Arcade</title><style>body{margin:0;background:#090d20;color:#eff8ff;font:16px system-ui;text-align:center}main{max-width:820px;margin:auto;padding:15px}a{color:#a8e8ff}canvas{width:100%;max-width:720px;aspect-ratio:3/2;border:3px solid #677bd3;border-radius:12px;background:#101d37;touch-action:none}button{padding:15px 24px;margin:5px;background:#344780;border:1px solid #a2b7ff;color:white;border-radius:12px;font-size:20px;touch-action:none;user-select:none}button:focus-visible{outline:3px solid #fff}.buttons{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:12px auto}.buttons button{min-width:64px}p{color:#b9c5de}</style></head><body><main><p><a href="arcade.html">← COSTIN ARCADE</a></p><h1>📡 Signal Runner</h1><p>Collect 10 signal cores. Avoid the roaming drones. Move with arrows / WASD or touch controls. Space activates a temporary shield.</p><div id="status" role="status" aria-live="polite">Collect 10 cores · 3 lives</div><canvas id="game" width="720" height="480" aria-label="Signal Runner game area"></canvas><div class="buttons"><div><button data-key="ArrowLeft" aria-label="Move left">◀</button><button data-key="ArrowUp" aria-label="Move up">▲</button><button data-key="ArrowDown" aria-label="Move down">▼</button><button data-key="ArrowRight" aria-label="Move right">▶</button></div><button data-key="Space" aria-label="Shield">SHIELD</button></div><button id="restart">Restart game</button></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),keys=new Set();let player,cores,drones,score,lives,shield,shieldCooldown,invincible,ended,tick;const rand=(a,b)=>a+Math.random()*(b-a);function reset(){player={x:90,y:240};cores=[];drones=[];score=0;lives=3;shield=0;shieldCooldown=0;invincible=0;ended=false;tick=0;keys.clear();for(let i=0;i<5;i++)cores.push({x:rand(55,665),y:rand(55,425)});for(let i=0;i<3;i++)drones.push({x:rand(350,650),y:rand(70,410),vx:rand(-2,2)||1.2,vy:rand(-2,2)||1.1});status.textContent='0 / 10 cores · 3 lives'}function circle(x,y,r,color){ctx.beginPath();ctx.fillStyle=color;ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function update(){if(ended)return;tick++;const move=k=>keys.has(k);player.x=Math.max(20,Math.min(700,player.x+((move('ArrowRight')||move('KeyD'))?4:0)-((move('ArrowLeft')||move('KeyA'))?4:0)));player.y=Math.max(20,Math.min(460,player.y+((move('ArrowDown')||move('KeyS'))?4:0)-((move('ArrowUp')||move('KeyW'))?4:0)));if(shieldCooldown>0)shieldCooldown--;if(shield>0)shield--;if(invincible>0)invincible--;if(move('Space')&&shieldCooldown===0){shield=100;shieldCooldown=350}let collected=0;cores=cores.filter(o=>{if(Math.hypot(o.x-player.x,o.y-player.y)<27){score++;collected++;return false}return true});for(let i=0;i<collected&&score<10;i++)cores.push({x:rand(40,680),y:rand(40,440)});drones.forEach(o=>{o.x+=o.vx;o.y+=o.vy;if(o.x<18||o.x>702)o.vx*=-1;if(o.y<18||o.y>462)o.vy*=-1;if(!shield&&!invincible&&Math.hypot(o.x-player.x,o.y-player.y)<31){lives--;invincible=85}});if(score>=10||lives<=0){ended=true;keys.clear()}status.textContent=ended?(score>=10?'VICTORY — all 10 cores collected!':'GAME OVER — press Restart to retry'):score+' / 10 cores · '+lives+' lives · '+(shield?'Shield active':shieldCooldown?'Shield recharging':'Shield ready')}
function draw(){ctx.fillStyle='#101d37';ctx.fillRect(0,0,720,480);ctx.strokeStyle='#243c60';for(let x=0;x<720;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,480);ctx.stroke()}for(let y=0;y<480;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(720,y);ctx.stroke()}cores.forEach(o=>{circle(o.x,o.y,13,'#f8d36e');circle(o.x,o.y,5,'#fff5bd')});drones.forEach(o=>{circle(o.x,o.y,20,'#f0799d');circle(o.x-6,o.y-3,4,'#17223d');circle(o.x+6,o.y-3,4,'#17223d')});if(shield)circle(player.x,player.y,30,'#55e8dd55');circle(player.x,player.y,18,invincible&&tick%10<5?'#6b769a':'#69e9dc');circle(player.x,player.y,7,'#eaffff');if(ended){ctx.fillStyle='#060b19dd';ctx.fillRect(0,0,720,480);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 42px system-ui';ctx.fillText(score>=10?'VICTORY!':'GAME OVER',360,228);ctx.font='20px system-ui';ctx.fillText('Press Restart to play again',360,268)}}function loop(){update();draw();requestAnimationFrame(loop)}document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>keys.delete(k)))});window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyW','KeyS'].includes(e.code)){e.preventDefault();keys.add(e.code)}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());document.getElementById('restart').addEventListener('click',reset);reset();requestAnimationFrame(loop)})();
</script></body></html>
