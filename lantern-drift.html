<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lantern Drift | COSTIN Arcade</title><meta name="description" content="Play Lantern Drift, a free original three-stage arcade game with touch and keyboard controls."><style>*{box-sizing:border-box}body{background:#0b1125;color:#eef6ff;font:16px system-ui;margin:0;text-align:center}main{max-width:800px;margin:20px auto;padding:12px}a{color:#a5d9ff}canvas{width:100%;aspect-ratio:2/1;background:#10213a;border:2px solid #7e9ed0;border-radius:12px;touch-action:none}button{background:#354e80;border:1px solid #92b7e9;color:white;border-radius:12px;padding:15px 24px;font-size:19px;touch-action:none;user-select:none}.controls{display:flex;justify-content:center;gap:16px;margin:14px}#status{min-height:28px;color:#b9e9de}</style></head><body><main><p><a href="arcade.html">← Back to arcade</a></p><h1>🏮 Lantern Drift</h1><p>Guide a floating lantern through three night skies. Collect light orbs, avoid storm clouds. Move with ← → or the touch buttons.</p><div id="status" role="status" aria-live="polite">Stage 1 · 0 / 5 lights · 3 hearts</div><canvas id="game" width="800" height="400" aria-label="Lantern Drift game screen"></canvas><div class="controls"><button id="left" aria-label="Move left">◀</button><button id="restart">Restart</button><button id="right" aria-label="Move right">▶</button></div><p>Original characters and artwork · No ROMs or copyrighted assets</p></main><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),held=new Set();let stage,lights,hearts,player,items,frame,ended,won,raf=0;
function reset(){stage=1;lights=0;hearts=3;player=400;items=[];frame=0;ended=false;won=false;status.textContent='Stage 1 · 0 / 5 lights · 3 hearts'}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function spawn(){const light=Math.random()<.66;items.push({x:24+Math.random()*752,y:-20,kind:light?'light':'cloud',speed:1.8+stage*.7})}
function tick(){if(!ended){frame++;if(held.has('left'))player=Math.max(22,player-5);if(held.has('right'))player=Math.min(778,player+5);if(frame%34===0)spawn();for(const it of items){it.y+=it.speed;if(Math.hypot(it.x-player,it.y-338)<30){it.y=450;if(it.kind==='light'){lights++;if(lights>=5){if(stage===3){ended=true;won=true}else{stage++;lights=0;items=[]}}}else hearts--;if(hearts<=0){ended=true;won=false}}}items=items.filter(it=>it.y<425);status.textContent=ended?(won?'Victory! All three stages cleared.':'Game over. Press Restart.'):('Stage '+stage+' · '+lights+' / 5 lights · '+hearts+' hearts')}
ctx.fillStyle='#10213a';ctx.fillRect(0,0,800,400);for(let i=0;i<40;i++)circle((i*137)%800,(i*79)%320,1.5,'#6c8eae');ctx.fillStyle='#1d4054';ctx.fillRect(0,366,800,34);for(const it of items){if(it.kind==='light'){circle(it.x,it.y,12,'#ffe28a');circle(it.x,it.y,5,'#fff7ce')}else{circle(it.x-9,it.y,14,'#ad6d9d');circle(it.x+8,it.y,16,'#9a6291')}}ctx.fillStyle='#f4ba68';ctx.fillRect(player-18,316,36,37);ctx.fillStyle='#fff0a8';ctx.fillRect(player-12,322,24,24);ctx.fillStyle='#e8796c';ctx.fillRect(player-22,350,44,8);if(ended){ctx.fillStyle='#081323dd';ctx.fillRect(0,0,800,400);ctx.fillStyle='#fff';ctx.font='bold 44px system-ui';ctx.textAlign='center';ctx.fillText(won?'YOU WIN!':'GAME OVER',400,195);ctx.font='20px system-ui';ctx.fillText('Press Restart to play again',400,232)}raf=requestAnimationFrame(tick)}
for(const id of ['left','right']){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.add(id)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>held.delete(id))}
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'){held.add('left');e.preventDefault()}if(e.key==='ArrowRight'||e.key==='d'){held.add('right');e.preventDefault()}if(e.key==='r')reset()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')held.delete('left');if(e.key==='ArrowRight'||e.key==='d')held.delete('right')});window.addEventListener('blur',()=>held.clear());document.getElementById('restart').addEventListener('click',reset);reset();tick()})();
</script></body></html>
