<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Garden | COSTIN Original Arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1024;color:#f4f4ff;font:16px system-ui;text-align:center}main{max-width:840px;margin:auto;padding:16px}canvas{display:block;width:100%;max-width:720px;aspect-ratio:16/9;margin:12px auto;border:2px solid #6675a5;border-radius:12px;touch-action:none;background:#10152c}button{background:#384b85;color:white;border:1px solid #91a5e3;border-radius:10px;padding:13px 20px;font:inherit;touch-action:none;cursor:pointer}button:focus-visible{outline:3px solid gold}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px}a{color:#c8d7ff}#status{min-height:24px}</style></head><body><main><a href="arcade.html">← Back to arcade</a><h1>🌙 Moon Garden</h1><p>Original arcade game. Collect 8 moon seeds while avoiding the wandering shadows. Three gardens to restore.</p><canvas id="game" width="720" height="405" aria-label="Moon Garden game canvas"></canvas><p id="status" role="status" aria-live="polite"></p><div class="controls"><button id="left" aria-label="Move left">◀</button><button id="up" aria-label="Move up">▲</button><button id="down" aria-label="Move down">▼</button><button id="right" aria-label="Move right">▶</button><button id="restart">Start / Restart</button></div><p>Arrow keys or WASD to move · R to restart · Touch buttons supported</p></main><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),keys=new Set();
let stage=1,seed=0,health=3,mode='ready',player={x:360,y:200},shadows=[],seeds=[],last=0,invincible=0;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function reset(){stage=1;health=3;mode='play';initStage();announce('Garden 1: collect 8 moon seeds');}
function initStage(){seed=0;player={x:360,y:200};invincible=0;shadows=Array.from({length:stage+1},(_,i)=>({x:90+i*165,y:90+i*40,vx:(i%2?1:-1)*(55+stage*13),vy:(i%2?-1:1)*(42+stage*10)}));seeds=Array.from({length:8},(_,i)=>({x:70+(i%4)*175,y:90+Math.floor(i/4)*195,taken:false}));}
function announce(s){status.textContent=s;}
function update(dt){if(mode!=='play')return;const speed=215;let dx=Number(keys.has('right'))-Number(keys.has('left')),dy=Number(keys.has('down'))-Number(keys.has('up'));const len=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/len*speed*dt,18,702);player.y=clamp(player.y+dy/len*speed*dt,18,387);for(const s of shadows){s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.x<25||s.x>695)s.vx*=-1;if(s.y<25||s.y>380)s.vy*=-1;if(invincible<=0&&Math.hypot(player.x-s.x,player.y-s.y)<28){health--;invincible=1.3;if(health<=0){mode='lost';announce('Game over. Press R or Restart to try again.');}}}invincible=Math.max(0,invincible-dt);for(const item of seeds){if(!item.taken&&Math.hypot(player.x-item.x,player.y-item.y)<25){item.taken=true;seed++;announce('Garden '+stage+': '+seed+'/8 seeds');}}if(seed===8){if(stage===3){mode='won';announce('Victory! All three moon gardens restored.');}else{stage++;initStage();announce('Garden '+stage+': collect 8 moon seeds');}}}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function draw(){ctx.fillStyle='#111936';ctx.fillRect(0,0,720,405);for(let i=0;i<35;i++)circle((i*173)%720,(i*97)%405,1.5,'#52658e');for(const s of seeds)if(!s.taken){circle(s.x,s.y,11,'#f8d46b');circle(s.x,s.y,4,'#fff4ba');}for(const s of shadows){circle(s.x,s.y,19,'#b45a98');circle(s.x-6,s.y-4,3,'#fff');circle(s.x+6,s.y-4,3,'#fff');}if(invincible<=0||Math.floor(invincible*10)%2===0){circle(player.x,player.y,17,'#75e4bb');circle(player.x-5,player.y-4,3,'#102a34');circle(player.x+5,player.y-4,3,'#102a34');}ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.fillText('Garden '+stage+'/3   Seeds '+seed+'/8   ♥ '+health,20,28);if(mode!=='play'){ctx.fillStyle='#000b';ctx.fillRect(0,150,720,100);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 27px system-ui';ctx.fillText(mode==='ready'?'Press Start':mode==='won'?'ALL GARDENS RESTORED':'GAME OVER',360,207);ctx.textAlign='left';}}
function tick(t){const dt=Math.min((t-last)/1000||0,.05);last=t;update(dt);draw();requestAnimationFrame(tick);}
const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};
window.addEventListener('keydown',e=>{if(map[e.key]){keys.add(map[e.key]);e.preventDefault();}if(e.key.toLowerCase()==='r')reset();});
window.addEventListener('keyup',e=>{if(map[e.key])keys.delete(map[e.key]);});
window.addEventListener('blur',()=>keys.clear());
for(const dir of ['left','right','up','down']){const b=document.getElementById(dir);b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(dir);b.setPointerCapture(e.pointerId);});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(dir));}
document.getElementById('restart').addEventListener('click',reset);announce('Ready. Press Start to play.');requestAnimationFrame(tick);
</script></body></html>
