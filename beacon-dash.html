<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beacon Dash | COSTIN Original Arcade</title><style>body{margin:0;background:#091325;color:#eff8ff;font:16px system-ui;text-align:center}main{max-width:720px;margin:auto;padding:16px}canvas{width:100%;max-width:600px;aspect-ratio:3/2;background:#10243a;border:2px solid #68d5d0;touch-action:none}button{font:700 18px system-ui;background:#255b82;color:white;border:1px solid #91d9f7;border-radius:12px;padding:13px;touch-action:none;min-width:55px}button:focus-visible{outline:3px solid yellow}.pad{display:grid;grid-template-columns:repeat(3,65px);justify-content:center;gap:5px;margin:12px}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.pad button:nth-child(3){grid-column:2}.pad button:nth-child(4){grid-column:3}#status{min-height:2em}a{color:#a9eeff}</style></head><body><main><a href="./arcade.html">← Arcade</a><h1>Beacon Dash</h1><p>Original COSTIN arcade game. Collect five beacons per stage while avoiding shadow drones. Three stages. Arrows / WASD or touch pad.</p><p id="status" role="status" aria-live="polite"></p><canvas id="screen" width="600" height="400" aria-label="Beacon Dash game"></canvas><div class="pad"><button data-dir="up" aria-label="Up">▲</button><button data-dir="left" aria-label="Left">◀</button><button data-dir="down" aria-label="Down">▼</button><button data-dir="right" aria-label="Right">▶</button></div><button id="restart">Start / Restart</button><p>Copyright-safe original shapes and gameplay. No ROMs or third-party assets.</p></main><script>(()=>{'use strict';const c=document.getElementById('screen'),g=c.getContext('2d'),status=document.getElementById('status'),keys=new Set();let stage=1,hearts=3,found=0,state='ready',player={x:50,y:200},beacons=[],drones=[],last=0,inv=0;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function reset(){stage=1;hearts=3;state='play';init()}function init(){found=0;inv=1;player={x:50,y:200};beacons=Array.from({length:5},(_,i)=>({x:120+i*93,y:70+((i*3+stage)%4)*77,got:false}));drones=Array.from({length:stage+1},(_,i)=>({x:270+i*80,y:90+i*95,vx:(i%2?1:-1)*(55+stage*15)}));updateStatus()}function updateStatus(){status.textContent='Stage '+stage+'/3 · Beacons '+found+'/5 · Hearts '+hearts+' · '+(state==='ready'?'Press Start':state==='win'?'You win!':state==='lose'?'Game over':'Playing')}function tick(dt){if(state!=='play')return;inv=Math.max(0,inv-dt);let dx=Number(keys.has('right'))-Number(keys.has('left')),dy=Number(keys.has('down'))-Number(keys.has('up'));const mag=Math.hypot(dx,dy)||1;player.x=clamp(player.x+dx/mag*190*dt,12,588);player.y=clamp(player.y+dy/mag*190*dt,12,388);for(const b of beacons){if(!b.got&&Math.hypot(player.x-b.x,player.y-b.y)<22){b.got=true;found++;if(found===5){if(stage===3){state='win'}else{stage++;init()}updateStatus();break}}}for(const d of drones){d.x+=d.vx*dt;if(d.x<18||d.x>582){d.vx*=-1;d.x=clamp(d.x,18,582)}if(inv===0&&Math.hypot(player.x-d.x,player.y-d.y)<24){hearts--;inv=1.2;if(hearts===0)state='lose';updateStatus()}}}function draw(){g.fillStyle='#10243a';g.fillRect(0,0,600,400);g.strokeStyle='#27465b';for(let x=0;x<600;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,400);g.stroke()}for(let y=0;y<400;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(600,y);g.stroke()}for(const b of beacons){if(b.got)continue;g.fillStyle='#ffe37b';g.beginPath();g.moveTo(b.x,b.y-14);g.lineTo(b.x+12,b.y);g.lineTo(b.x,b.y+14);g.lineTo(b.x-12,b.y);g.fill()}for(const d of drones){g.fillStyle='#c779ef';g.fillRect(d.x-14,d.y-14,28,28);g.fillStyle='#12243c';g.fillRect(d.x-5,d.y-5,10,10)}if(inv===0||Math.floor(inv*10)%2===0){g.fillStyle='#5cf2d2';g.beginPath();g.arc(player.x,player.y,13,0,Math.PI*2);g.fill();g.fillStyle='#103344';g.fillRect(player.x-3,player.y-3,6,6)}if(state!=='play'){g.fillStyle='#000b';g.fillRect(80,140,440,110);g.fillStyle='white';g.font='bold 27px system-ui';g.textAlign='center';g.fillText(state==='ready'?'Press Start':state==='win'?'All beacons rescued!':'Game over',300,202);g.textAlign='start'}}function frame(t){let dt=Math.min((t-last)/1000||0,.05);last=t;tick(dt);draw();requestAnimationFrame(frame)}document.getElementById('restart').onclick=reset;const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right'};addEventListener('keydown',e=>{if(map[e.code]){e.preventDefault();keys.add(map[e.code])}});addEventListener('keyup',e=>{if(map[e.code])keys.delete(map[e.code])});addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-dir]').forEach(b=>{const k=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});updateStatus();requestAnimationFrame(frame)})();</script></body></html>
